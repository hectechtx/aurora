<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="100%" stop-color="#0b0f18" />
    </radialGradient>
    <linearGradient id="band1" x1="60" y1="360" x2="452" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3cd0ec" />
      <stop offset="55%" stop-color="#7fb8ec" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="band2" x1="70" y1="300" x2="440" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3cd0ec" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <linearGradient id="band3" x1="90" y1="250" x2="420" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f5" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- three aurora ribbons, back to front -->
  <path d="M 96 300 C 170 210, 230 340, 300 250 C 350 185, 390 220, 430 150"
        stroke="url(#band3)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.35" />
  <path d="M 78 330 C 160 235, 225 365, 300 275 C 355 205, 395 245, 440 175"
        stroke="url(#band2)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 60 362 C 150 258, 220 392, 300 300 C 360 228, 400 268, 452 198"
        stroke="url(#band1)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- spark: a soft point of light where the front ribbon crests, standing in for her presence -->
  <circle cx="300" cy="300" r="46" fill="url(#spark)" opacity="0.55" />
  <circle cx="300" cy="300" r="10" fill="#ffffff" />
</svg>
